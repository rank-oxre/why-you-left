<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exit Survey</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #313338;
            color: #f2f3f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .form-container {
            background-color: #2b2d31;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 480px;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 24px;
            text-align: center;
            color: #ffffff;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 8px;
            color: #b5bac1;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 10px;
            background-color: #1e1f22;
            border: 1px solid #1e1f22;
            border-radius: 4px;
            color: #dbdee1;
            font-size: 16px;
            transition: border-color 0.2s ease;
        }

        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: #5865f2;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #5865f2;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: #4752c4;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h1>Why you left?</h1>
        
        <form id="leaveForm">
            <div class="form-group">
                <label for="username">Discord Username</label>
                <input type="text" id="username" placeholder="e.g. wumpus" required>
            </div>

            <div class="form-group">
                <label for="reason">Why did you leave?</label>
                <textarea id="reason" placeholder="Please let us know your reasons..." required></textarea>
            </div>

            <button type="submit" id="submitBtn">Submit Feedback</button>
        </form>
    </div>

    <script>
        document.getElementById('leaveForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Stop page refresh

            
            const webhookUrl = 'https://discord.com/api/webhooks/1554008161680367626/YX8hO6PlXeWnDi3TOMlorQdKhYWDI34SwRXRI6T23a8ffl5djINNiwRgWaLXsIVWs2lD'; 

            const username = document.getElementById('username').value;
            const reason = document.getElementById('reason').value;
            const submitBtn = document.getElementById('submitBtn');

            // Visual feedback during submission
            submitBtn.innerText = 'Sending...';
            submitBtn.disabled = true;

            // Format the message using a clean Discord Embed
            const payload = {
                embeds: [{
                    title: "🚪 New Exit Survey Response",
                    color: 15548997, // Red color hex converted to decimal
                    fields: [
                        {
                            name: "👤 User",
                            value: `\`${username}\``,
                            inline: false
                        },
                        {
                            name: "💬 Reason for Leaving",
                            value: reason,
                            inline: false
                        }
                    ],
                    timestamp: new Date().toISOString()
                }]
            };

            // Send the data via Fetch API
            fetch(webhookUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            })
            .then(response => {
                if (response.ok) {
                    alert('Thank you for your feedback!');
                    document.getElementById('leaveForm').reset();
                } else {
                    alert('Something went wrong. Please try again.');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Network error. Failed to send.');
            })
            .finally(() => {
                submitBtn.innerText = 'Submit Feedback';
                submitBtn.disabled = false;
            });
        });
    </script>

</body>
</html>
